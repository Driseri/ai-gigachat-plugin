name: Release Plugin

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract version from manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Test GigaChat integration
        run: node --test tests/gigachat.test.cjs

      - name: Create plugin package
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          zip -r gigachat-assistant-plugin.zip \
            manifest.json \
            index.html \
            plugin.js \
            icon.svg

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            GigaChat AI assistant for Super Productivity desktop. Manage tasks, projects, tags and timers with a personal GigaChat API key (`GIGACHAT_API_PERS`). The plugin checks the key and loads available chat models automatically.

            **Requires Super Productivity desktop 18.13.1+** and consent for `nodeExecution`. Android and web versions are not supported.

            Download `gigachat-assistant-plugin.zip`, then open **Settings → Plugins → Choose Plugin File** in Super Productivity. See the [README](https://github.com/${{ github.repository }}#readme) for setup, screenshots and troubleshooting.
          files: gigachat-assistant-plugin.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
